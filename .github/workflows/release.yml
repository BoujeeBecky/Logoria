name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile dalamud.zip
          Expand-Archive dalamud.zip dalamud
          "DALAMUD_HOME=$pwd\dalamud" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append

      # Release, never Debug. Debug additionally compiles the diagnostics tooling,
      # which must not reach a published build.
      - name: Build
        run: dotnet build -c Release

      # Confirms the shipped assembly carries no diagnostics tooling and no
      # networking reference. Fails the release rather than publishing a build
      # that quietly does.
      - name: Verify the shipped assembly
        run: dotnet run --project Tools\VerifyRelease -c Release -- bin\Release\Logoria.dll

      # Release title = first line of RELEASE_NOTES.md (leading "# " stripped);
      # the file body becomes the release notes.
      - name: Read release title
        shell: pwsh
        run: |
          $title = ((Get-Content RELEASE_NOTES.md -TotalCount 1) -replace '^#\s*','').Trim()
          "RELEASE_TITLE=$title" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Quoted, and separated by a hyphen rather than a colon: ": " inside an
          # unquoted YAML scalar is a mapping, not text, and would fail to parse.
          name: "${{ github.ref_name }} - ${{ env.RELEASE_TITLE }}"
          body_path: RELEASE_NOTES.md
          files: bin/Release/Logoria/latest.zip
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
